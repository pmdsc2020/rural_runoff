name: Build Release APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: |
          flutter create . --platforms=android --org com.ruralrunoff
          # Location permissions for outlet GPS capture, and a readable launcher label
          M=android/app/src/main/AndroidManifest.xml
          sed -i -e 's#^\(\s*\)<application#\1<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n\1<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n\1<application#' \
                 -e 's#android:label="rural_runoff"#android:label="RuralRunoff"#' $M
          grep -q ACCESS_FINE_LOCATION $M

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/rational_calculator_test.dart test/app_flow_test.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuralRunoff-APK
          path: build/app/outputs/flutter-apk/app-release.apk
